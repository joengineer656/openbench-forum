<!doctype html>
<html lang="ar" dir="rtl" data-default="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBench | بطاقات المجالات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/data.js"></script><script src="shared/core.js"></script>
<style>
:root{--bg:#e8ebf0;--ink:#1c2029;--soft:#5b6372;--panel:#fff;--line:#d6dae2;--focus:#2547d0;--accent:#2547d0;--accent-ink:#fff;--fh:"El Messiri",serif;--f:"Vazirmatn",sans-serif}
html[data-theme=dark]{--bg:#0f1115;--ink:#eef0f4;--soft:#a1a8b4;--panel:#1a1d24;--line:#2a2f38;--focus:#8ea4ff;--accent:#8ea4ff;--accent-ink:#0a1030}
body{background:var(--bg);color:var(--ink);font:400 .95rem/1.75 var(--f)}
.wrap{max-width:1180px;margin:auto;padding:0 24px}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.logo{font:700 1.5rem var(--fh);direction:ltr}
.top nav{display:flex;gap:4px 18px;color:var(--soft);margin-inline-start:10px;font-size:.9rem}
.top nav a:hover,.top nav a[aria-current]{color:var(--ink)}
.tools{display:flex;gap:8px;margin-inline-start:auto;align-items:center}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.btn{display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:12px;font-weight:700;white-space:nowrap;font-size:.9rem}
.btn-a{background:var(--accent);color:var(--accent-ink)}.btn-g{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.hello{padding:30px 0 20px}
.hello h1{font:700 clamp(1.9rem,4vw,2.8rem)/1.35 var(--fh)}
.hello p{color:var(--soft);max-width:56ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start;padding-bottom:64px}
.stack{padding-top:8px}
.card{position:relative;border-radius:26px;background:var(--c);color:var(--ci);box-shadow:0 -6px 18px rgba(0,0,0,.18);transition:margin .3s}
.card+.card{margin-top:-34px}
.card:not(.is-on){cursor:pointer}
.card.is-on{z-index:5;margin-block:14px;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.card.is-on+.card{margin-top:-20px}
.hd{display:flex;align-items:center;gap:14px;width:100%;padding:18px 24px 46px;text-align:start;border-radius:26px}
.card.is-on .hd{padding-bottom:16px}
.hd .ic{width:28px;height:28px;opacity:.9}
.hd h2{font:700 1.55rem/1.2 var(--fh)}
.hd small{display:block;font:400 .85rem var(--f);opacity:.85}
.hd .n{margin-inline-start:auto;text-align:end;font:700 1.3rem var(--fh)}
.hd .n small{font-weight:400}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.card.is-on .bd{grid-template-rows:1fr}
.bd>div{overflow:hidden}
.in{margin:0 12px 12px;padding:16px;border-radius:18px;background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:2px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:.86rem;color:var(--soft)}
.chip.is-on{background:var(--ink);color:var(--panel);box-shadow:none}
.th li a{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.th li:first-child a{border-top:0}
.th b{display:block;font-weight:500;line-height:1.55}
.th a:hover b{color:var(--accent)}
.m{font-size:.8rem;color:var(--soft)}
.in h3{font:700 1.1rem var(--fh);margin:16px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:block}
.tile .cover{aspect-ratio:1;border-radius:14px}
.tile b{display:block;margin-top:5px;font-size:.82rem;font-weight:500;line-height:1.45}
.tile:hover b{color:var(--accent)}
.cl li a{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cl li:first-child a{border-top:0}
.cl a:hover b{color:var(--accent)}
.empty{padding:10px 0;color:var(--soft)}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.box{padding:16px;border-radius:22px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.box h2{font:700 1.15rem var(--fh);margin-bottom:8px}
.box li a{display:block;padding:7px 0;line-height:1.55;font-size:.88rem;border-top:1px solid var(--line)}
.box li:first-child a{border-top:0}
.box li a:hover{color:var(--accent)}
.box small{display:block;color:var(--soft)}
.vid{position:relative;display:block}.vid .cover{aspect-ratio:16/9;border-radius:14px}
.play{position:absolute;inset:0;margin:auto;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.play .ic{width:18px;height:18px;translate:-1px 0}
.faces{display:flex;flex-wrap:wrap;gap:6px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 22px;min-height:72px;align-items:center;color:var(--soft);font-size:.88rem}
.foot span{margin-inline-start:auto}
@media (max-width:920px){.grid{grid-template-columns:1fr}.side{position:static}.top nav{display:none}}
@media (max-width:560px){.wrap{padding:0 14px}.hd{padding-inline:16px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tools .btn-g{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#">OpenBench</a><nav aria-label="التنقل الرئيسي" id="nav"></nav>
  <div class="tools"><button class="ib" data-theme-toggle type="button"></button><a class="btn btn-g" href="#">دخول</a><a class="btn btn-a" href="#">أنشئ حسابك</a></div>
</div></header>
<main class="wrap">
  <section class="hello"><h1>محفظتك الهندسية</h1><p>لكل مجال بطاقة. اضغط على بطاقة لتفتحها وترى نقاشاتها ومشاريعها ودوراتها.</p></section>
  <div class="grid">
    <div class="stack" id="stack" aria-label="المجالات الهندسية"></div>
    <aside class="side" id="side"></aside>
  </div>
</main>
<footer class="foot"><div class="wrap"><a href="#">عن المنتدى</a><a href="#">القوانين</a><a href="#">الخصوصية</a><a href="#">تواصل معنا</a><span>© 2026 OpenBench</span></div></footer>
<script>
OB.ready(function(){
  var D=OB.D,$=OB.$;
  $('#nav').innerHTML=OB.nav(0);
  // Strong card colours per field; dark text on the amber card.
  var COL={mecha:['#2547d0','#fff'],robot:['#6b3fc9','#fff'],embed:['#e59a16','#1f1500'],soft:['#2e3440','#fff'],mech:['#c2338a','#fff'],elec:['#0e8a62','#fff']};
  var stack=$('#stack');
  stack.innerHTML=D.fields.map(function(f){return '<section class="card" data-card="'+f.id+'" style="--c:'+COL[f.id][0]+';--ci:'+COL[f.id][1]+'"><button type="button" class="hd" data-field="'+f.id+'" aria-expanded="false" aria-controls="b-'+f.id+'">'+OB.icon(f.icon)+'<span><h2>'+f.name+'</h2><small>'+f.desc+'</small></span><span class="n">'+f.topics+'<small> موضوع</small></span></button><div class="bd" id="b-'+f.id+'" role="region" aria-label="'+f.name+'"><div><div class="in"></div></div></div></section>';}).join('');
  OB.group(stack,'data-field','field');
  OB.bindKinds(stack);

  function body(f,k){
    var th=OB.threads(f.id,k),pr=OB.projects(f.id),co=OB.courses(f.id);
    return OB.kindBar(k)+'<ul class="th">'+(th.map(function(t){return '<li><a href="#">'+OB.av(t.by,'32px')+'<div><b>'+t.title+'</b><span class="m">'+OB.kindTags(t)+' '+t.by+'، '+t.ago+'</span></div></a></li>';}).join('')||'<li class="empty">لا توجد مشاركات من هذا النوع بعد.</li>')+'</ul>'+
     '<h3>مشاريع الأعضاء</h3><div class="tiles">'+pr.map(function(p){return '<a class="tile" href="#">'+OB.cover(p)+'<b>'+p.title+'</b></a>';}).join('')+'</div>'+
     '<h3>الدورات</h3><ul class="cl">'+co.map(function(c){return '<li><a href="#"><b>'+c.title+'</b><span class="m">'+c.n+' درسًا، '+c.level+'</span></a></li>';}).join('')+'</ul>';
  }
  OB.on(function(s){
    D.fields.forEach(function(f){
      var card=$('[data-card="'+f.id+'"]'),on=f.id===s.field,inner=$('.in',card),bd=$('.bd',card);
      card.classList.toggle('is-on',on);
      if(on){inner.innerHTML=body(f,s.kind);bd.removeAttribute('inert');}else bd.setAttribute('inert','');
    });
  });
  var v=D.video;
  $('#side').innerHTML='<section class="box"><h2>أحدث فيديو</h2><a class="vid" href="#">'+OB.cover(v)+'<span class="play">'+OB.icon('play')+'</span></a><p style="margin-top:8px;font-weight:500;font-size:.9rem">'+v.title+'</p></section>'+
    '<section class="box"><h2>أسئلة بلا إجابة</h2><ul>'+OB.unanswered(4).map(function(t){return '<li><a href="#">'+t.title+'<small>'+t.by+'، '+t.ago+'</small></a></li>';}).join('')+'</ul></section>'+
    '<section class="box"><h2>متصلون الآن ('+D.stats.online+')</h2><div class="faces">'+D.online.map(function(n){return OB.av(n,'30px');}).join('')+'</div></section>';
});
</script>
</body>
</html>
