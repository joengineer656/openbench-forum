<!doctype html>
<html lang="ar" dir="rtl" data-default="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBench | تطبيق المجتمع</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/data.js"></script><script src="shared/core.js"></script>
<style>
:root{--rail:#e9e7f6;--side:#f1f0fa;--main:#fbfbfe;--card:#fff;--line:#dedcee;--ink:#1d1b33;--soft:#5e5b7d;--teal:#0e9c8f;--teal-ink:#fff;--amber:#e69500;--hover:#e3e1f4;--focus:#0e9c8f;--f:"Vazirmatn",sans-serif}
html[data-theme=dark]{--rail:#1f1d36;--side:#2a2846;--main:#322f55;--card:#3a3763;--line:#443f6e;--ink:#f1f0fb;--soft:#b6b3d6;--teal:#2fd0c0;--teal-ink:#052b27;--amber:#ffb020;--hover:#38355f;--focus:#2fd0c0}
body{background:var(--rail);color:var(--ink);font:400 .95rem/1.7 var(--f)}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
.bar{display:flex;align-items:center;gap:14px;padding:0 18px;min-height:56px;background:var(--rail);border-bottom:1px solid var(--line)}
.logo{font:800 1.2rem var(--f);direction:ltr}
.bar nav{display:flex;gap:2px 16px;color:var(--soft);font-size:.9rem}
.bar nav a:hover,.bar nav a[aria-current]{color:var(--ink)}
.bar .tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.bar input{width:200px;height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--side)}
.ib{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--side)}
.btn{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:10px;font-weight:700;white-space:nowrap}
.btn-t{background:var(--teal);color:var(--teal-ink)}
.btn-g{background:var(--side)}
.cols{display:grid;grid-template-columns:76px 250px minmax(0,1fr) 290px;min-height:0}
.rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;overflow-y:auto;background:var(--rail)}
.fb{position:relative;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--side);color:var(--soft);transition:border-radius .15s,background .15s,color .15s}
.fb .ic{width:22px;height:22px}
.fb:hover{border-radius:16px;color:var(--ink)}
.fb.is-on{border-radius:16px;background:var(--teal);color:var(--teal-ink)}
.fb.is-on::before{content:"";position:absolute;inset-inline-start:-14px;width:5px;height:28px;border-radius:0 5px 5px 0;background:var(--teal);transform:scaleX(-1)}
.fb .dot{position:absolute;top:-2px;inset-inline-end:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#1a1200;font:700 .7rem/18px var(--f);text-align:center;padding:0 4px;border:2px solid var(--rail)}
.chan{display:flex;flex-direction:column;background:var(--side);border-radius:16px 0 0 0;min-height:0;overflow-y:auto}
.chan h2{padding:16px 16px 4px;font:800 1.1rem var(--f)}
.chan .d{padding:0 16px 12px;color:var(--soft);font-size:.82rem;border-bottom:1px solid var(--line)}
.chan .grp{padding:14px 16px 4px;color:var(--soft);font-size:.8rem;font-weight:500}
.ch{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:1px 8px;padding:6px 10px;border-radius:8px;text-align:start;color:var(--soft)}
.ch:hover{background:var(--hover);color:var(--ink)}
.ch.is-on{background:var(--hover);color:var(--ink);font-weight:700}
.ch .h{opacity:.6;font-weight:400}
.ch .ct{margin-inline-start:auto;font-size:.8rem}
.ch .u{margin-inline-start:auto;background:var(--amber);color:#1a1200;border-radius:9px;padding:0 7px;font-size:.75rem;font-weight:700}
.feed{background:var(--main);overflow-y:auto;min-height:0;padding:0 24px 40px}
.feed header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 0 12px;background:var(--main);border-bottom:1px solid var(--line);margin-bottom:12px}
.feed header h2{font:800 1.15rem var(--f)}
.feed header span{color:var(--soft);font-size:.88rem}
.msg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 10px;border-radius:12px}
.msg:hover{background:var(--card)}
.msg .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.msg .who b{font-weight:700}.msg .who span{color:var(--soft);font-size:.8rem}
.msg .tt{display:block;margin-top:2px;font-weight:500;font-size:1rem;line-height:1.6}
.msg:hover .tt{color:var(--teal)}
.reacts{display:flex;gap:8px;margin-top:6px;color:var(--soft);font-size:.82rem}
.reacts span{display:inline-flex;gap:4px;align-items:center;padding:1px 10px;border-radius:12px;background:var(--side)}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-top:8px}
.post{display:flex;flex-direction:column;border-radius:14px;background:var(--card);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.post .cover{aspect-ratio:16/10}
.post .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.post b{font-weight:700;line-height:1.5}
.tg{display:flex;flex-wrap:wrap;gap:4px}.tg i{font-style:normal;font-size:.75rem;padding:0 8px;border-radius:6px;background:var(--side);color:var(--soft);direction:ltr}
.post .f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;color:var(--soft);font-size:.82rem}
.post .f span{display:flex;gap:6px;align-items:center}
.lk{display:inline-flex;gap:4px;align-items:center;color:var(--amber)}.lk .ic{width:15px;height:15px}
.st{position:absolute;top:10px;inset-inline-end:10px;padding:1px 10px;border-radius:10px;background:var(--amber);color:#1a1200;font-size:.75rem;font-weight:700}
.post a.c{position:relative;display:block}
.aside{background:var(--side);padding:16px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:20px;border-inline-start:1px solid var(--line)}
.aside h3{font:700 .95rem var(--f);margin-bottom:8px}
.aside .faces{display:flex;flex-wrap:wrap;gap:6px}
.aside li a{display:block;padding:8px 10px;border-radius:8px;line-height:1.5;font-size:.88rem}
.aside li a:hover{background:var(--hover)}
.aside small{display:block;color:var(--soft)}
.vid{position:relative}.vid .cover{aspect-ratio:16/9;border-radius:10px}
.play{position:absolute;inset:0;margin:auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--teal-ink)}
.play .ic{width:18px;height:18px;translate:-1px 0}
.empty{padding:20px 10px;color:var(--soft)}
@media (max-width:1180px){.cols{grid-template-columns:76px 220px minmax(0,1fr)}.aside{display:none}}
@media (max-width:820px){
  .app{height:auto;display:block}
  .bar nav,.bar input,.bar .btn-g{display:none}
  .cols{display:block}
  .rail{flex-direction:row;padding:10px 14px;overflow-x:auto}
  .fb.is-on::before{display:none}
  .chan{border-radius:0;overflow:visible}
  .chan .grp{display:none}
  .chan .list{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
  .ch{width:auto;margin:0;background:var(--rail)}
  .feed{padding:0 14px 32px;overflow:visible}
  .feed header{position:static}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a class="logo" href="#">OpenBench</a>
    <nav aria-label="التنقل الرئيسي" id="nav"></nav>
    <div class="tools"><input type="search" placeholder="ابحث" aria-label="بحث"><button class="ib" data-theme-toggle type="button"></button><a class="btn btn-g" href="#">دخول</a><a class="btn btn-t" href="#">أنشئ حسابك</a></div>
  </div>
  <div class="cols">
    <div class="rail" id="rail" role="tablist" aria-orientation="vertical" aria-label="المجالات الهندسية"></div>
    <nav class="chan" aria-label="أقسام المجال"><h2 id="fname"></h2><p class="d" id="fdesc"></p><div id="chs"></div></nav>
    <main class="feed" id="feed" tabindex="-1"></main>
    <aside class="aside" id="aside" aria-label="الشريط الجانبي"></aside>
  </div>
</div>
<script>
OB.ready(function(){
  var D=OB.D,$=OB.$;
  $('#nav').innerHTML=OB.nav(0);
  var open={};D.threads.forEach(function(t){if(t.k==='q'&&t.r===0)open[t.f]=(open[t.f]||0)+1;});
  $('#rail').innerHTML=D.fields.map(function(f){return '<button type="button" role="tab" class="fb" data-field="'+f.id+'" aria-label="'+f.name+'" title="'+f.name+'">'+OB.icon(f.icon)+(open[f.id]?'<span class="dot" aria-label="'+open[f.id]+' أسئلة بلا إجابة">'+open[f.id]+'</span>':'')+'</button>';}).join('');
  OB.group($('#rail'),'data-field','field');

  var CH=[['all','كل المشاركات','list'],['q','الأسئلة'],['t','الشروحات'],['d','النقاشات'],['p','مشاريع الأعضاء'],['c','الدورات']];
  $('#chs').innerHTML='<div class="grp">المشاركات</div><div class="list" id="l1"></div><div class="grp">المعارض</div><div class="list" id="l2"></div>';
  function chBtn(c,f){return '<button type="button" class="ch" data-kind="'+c[0]+'"><span class="h">#</span>'+c[1]+'<span class="ct" data-ct="'+c[0]+'"></span></button>';}
  $('#l1').innerHTML=CH.slice(0,4).map(chBtn).join('');$('#l2').innerHTML=CH.slice(4).map(chBtn).join('');
  OB.group($('#chs'),'data-kind','kind');

  function threadRows(list){return list.map(function(t){return '<a class="msg" href="#">'+OB.av(t.by,'40px')+'<div><div class="who"><b>'+t.by+'</b><span>'+t.ago+'</span>'+OB.kindTags(t)+'</div><span class="tt">'+t.title+'</span><div class="reacts"><span>'+OB.icon('msg')+' '+t.r+'</span></div></div></a>';}).join('')||'<p class="empty">لا توجد مشاركات من هذا النوع بعد. كن أول من يكتب.</p>';}
  function projectCards(list,f){return '<div class="posts">'+list.map(function(p){return '<article class="post"><a class="c" href="#">'+OB.cover(p)+'<span class="st">'+p.st+'</span></a><div class="b"><b>'+p.title+'</b><div class="tg">'+p.tags.map(function(x){return '<i>'+x+'</i>';}).join('')+'</div><div class="f"><span>'+OB.av(p.by,'24px')+p.by+'</span><span class="lk">'+OB.icon('heart')+p.likes+'</span></div></div></article>';}).join('')+'</div>';}
  function courseCards(list){return '<div class="posts">'+list.map(function(c){return '<article class="post"><a class="c" href="#">'+OB.cover(c)+'<span class="st">'+c.level+'</span></a><div class="b"><b>'+c.title+'</b><div class="f"><span>'+OB.av(c.by,'24px')+c.by+'</span><span>'+c.n+' درسًا</span></div></div></article>';}).join('')+'</div>';}

  OB.on(function(s){
    var f=OB.field(s.field),k=s.kind,name=(CH.filter(function(c){return c[0]===k;})[0]||[])[1];
    $('#fname').textContent=f.name;$('#fdesc').textContent=f.desc;
    ['all','q','t','d'].forEach(function(x){var n=OB.threads(s.field,x).length;$('[data-ct="'+x+'"]').textContent=n;});
    $('[data-ct="p"]').textContent=OB.projects(s.field).length;$('[data-ct="c"]').textContent=OB.courses(s.field).length;
    var body=k==='p'?projectCards(OB.projects(s.field)):k==='c'?courseCards(OB.courses(s.field)):threadRows(OB.threads(s.field,k));
    $('#feed').innerHTML='<header><span class="h" style="opacity:.6">#</span><h2>'+f.name+'، '+name+'</h2><span>'+f.desc+'</span></header>'+body;
  });
  var v=D.video;
  $('#aside').innerHTML='<section class="vid"><h3>أحدث فيديو</h3><a href="#" style="position:relative;display:block">'+OB.cover(v)+'<span class="play">'+OB.icon('play')+'</span></a><p style="margin-top:8px;font-weight:700;font-size:.9rem">'+v.title+'</p><small style="color:var(--soft)">'+v.ago+'، '+v.comments+' تعليقًا</small></section>'+
    '<section><h3>أسئلة تنتظر إجابة</h3><ul>'+OB.unanswered(4).map(function(t){return '<li><a href="#">'+t.title+'<small>'+t.by+'، '+t.ago+'</small></a></li>';}).join('')+'</ul></section>'+
    '<section><h3>متصلون الآن ('+D.stats.online+')</h3><div class="faces">'+D.online.map(function(n){return OB.av(n,'32px');}).join('')+'</div></section>';
});
</script>
</body>
</html>
