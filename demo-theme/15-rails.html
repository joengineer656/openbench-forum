<!doctype html>
<html lang="ar" dir="rtl" data-default="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBench | صفوف أفقية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mada:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/data.js"></script><script src="shared/core.js"></script>
<style>
:root{--bg:#fff;--ink:#14181f;--soft:#5a6472;--line:#e5e8ee;--blue:#0b63f6;--blue-ink:#fff;--card:#fff;--bar:rgba(255,255,255,.88);--focus:#0b63f6;--f:"Mada",sans-serif}
html[data-theme=dark]{--bg:#0c0e12;--ink:#f0f2f6;--soft:#a0a8b4;--line:#242932;--blue:#5b9bff;--blue-ink:#06142e;--card:#171b22;--bar:rgba(12,14,18,.88);--focus:#5b9bff}
body{background:var(--bg);color:var(--ink);font:400 1.02rem/1.7 var(--f)}
.wrap{max-width:1320px;margin:auto;padding:0 28px}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.logo{font:900 1.45rem var(--f);direction:ltr}
.top nav{display:flex;gap:4px 18px;color:var(--soft);font-weight:500;margin-inline-start:8px}
.top nav a:hover,.top nav a[aria-current]{color:var(--ink)}
.tools{display:flex;gap:8px;margin-inline-start:auto;align-items:center}
.tools input{width:200px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card)}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.btn{display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:19px;font-weight:600;white-space:nowrap}
.btn-b{background:var(--blue);color:var(--blue-ink)}.btn-g{box-shadow:inset 0 0 0 1px var(--line)}
.hero{padding:38px 0 22px}
.hero h1{font:900 clamp(1.9rem,4.4vw,3.2rem)/1.3 var(--f);max-width:20ch}
.hero p{color:var(--soft);max-width:60ch;font-size:1.1rem;margin-top:6px}
.sticky{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(12px);border-block:1px solid var(--line)}
.sticky .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.segbar{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 6%,transparent);overflow-x:auto;scrollbar-width:none}
.sgb{padding:6px 16px;border-radius:10px;font-weight:600;white-space:nowrap;color:var(--soft)}
.sgb:hover{color:var(--ink)}
.sgb.is-on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chips{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.chip{padding:4px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-weight:500;color:var(--soft);font-size:.92rem}
.chip.is-on{background:var(--ink);color:var(--bg);box-shadow:none}
.band{padding:34px 0 18px;background:hsl(var(--hh) 75% 97%)}
html[data-theme=dark] .band{background:hsl(var(--hh) 28% 10%)}
.band+.band{border-top:1px solid transparent}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}
.head h2{font:900 1.9rem/1.3 var(--f)}
.head p{color:var(--soft)}
.head a{color:var(--blue);font-weight:600;white-space:nowrap}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 18px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start;flex:none}
.list{width:min(360px,86vw);padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.list h3{font:700 1rem var(--f);margin-bottom:4px}
.list li a{display:block;padding:8px 0;border-top:1px solid var(--line);line-height:1.5}
.list li:first-child a{border-top:0}
.list li a:hover b{color:var(--blue)}
.list b{font-weight:600;display:block}
.list .m{font-size:.84rem;color:var(--soft)}
.pc{width:min(290px,76vw);display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.pc .cover{aspect-ratio:4/3}
.pc .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc b{font-weight:700;line-height:1.5}
.tg{display:flex;flex-wrap:wrap;gap:4px}.tg i{font-style:normal;font-size:.74rem;padding:0 8px;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--soft);direction:ltr}
.pc .f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--soft);font-size:.86rem}
.pc .f span{display:flex;gap:6px;align-items:center}
.pc:hover{box-shadow:0 0 0 2px var(--blue)}
.cc{width:min(300px,80vw);display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:18px;border-radius:18px;color:#fff;background:hsl(var(--h) 55% 36%);position:relative;overflow:hidden}
.cc::after{content:"";position:absolute;inset-inline-end:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;background:hsl(var(--h) 80% 60%/.3)}
.cc b{font:900 1.3rem/1.4 var(--f);position:relative;z-index:1}
.cc .m{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.88rem;opacity:.92}
.cc .lv{align-self:flex-start;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.22);font-weight:600;font-size:.82rem}
.cc:hover{filter:brightness(1.1)}
.empty{padding:14px 0;color:var(--soft)}
.under{padding:36px 0 56px}
.under .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.under h2{font:800 1.2rem var(--f);margin-bottom:10px}
.under li a{display:block;padding:8px 0;border-top:1px solid var(--line)}
.under li:first-child a{border-top:0}
.under small{display:block;color:var(--soft)}
.vid{position:relative;display:block}.vid .cover{aspect-ratio:16/9;border-radius:14px}
.play{position:absolute;inset:0;margin:auto;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--blue);color:var(--blue-ink)}
.play .ic{width:20px;height:20px;translate:-1px 0}
.faces{display:flex;flex-wrap:wrap;gap:6px}
.foot{border-top:1px solid var(--line)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 22px;min-height:72px;align-items:center;color:var(--soft)}
.foot span{margin-inline-start:auto}
@media (max-width:900px){.top nav,.tools input{display:none}.under .wrap{grid-template-columns:1fr}.chips{margin-inline-start:0}}
@media (max-width:600px){.wrap{padding:0 16px}.tools .btn-g{display:none}.head{flex-direction:column;align-items:start;gap:2px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#">OpenBench</a><nav aria-label="التنقل الرئيسي" id="nav"></nav>
  <div class="tools"><input type="search" placeholder="ابحث" aria-label="بحث"><button class="ib" data-theme-toggle type="button"></button><a class="btn btn-g" href="#">دخول</a><a class="btn btn-b" href="#">أنشئ حسابك</a></div>
</div></header>
<section class="hero wrap"><h1>تصفّح المجتمع بالعرض، مجالًا بعد مجال</h1><p>في كل مجال صف واحد: آخر النقاشات، ثم مشاريع الأعضاء، ثم الدورات. اسحب الصف أو اضغط على المجال في الشريط.</p></section>
<div class="sticky"><div class="wrap">
  <div class="segbar" id="seg" aria-label="المجالات"></div>
  <div id="kb"></div>
</div></div>
<main id="rows"></main>
<section class="under"><div class="wrap" id="under"></div></section>
<footer class="foot"><div class="wrap"><a href="#">عن المنتدى</a><a href="#">القوانين</a><a href="#">الخصوصية</a><a href="#">تواصل معنا</a><span>© 2026 OpenBench</span></div></footer>
<script>
OB.ready(function(){
  var D=OB.D,$=OB.$,lock=0;
  $('#nav').innerHTML=OB.nav(0);
  $('#seg').innerHTML=D.fields.map(function(f){return '<button type="button" class="sgb" data-field="'+f.id+'">'+f.name+'</button>';}).join('');
  // Clicking a field scrolls to its row; scrolling past a row updates the picker.
  OB.group($('#seg'),'data-field','field',function(id){
    lock=Date.now();OB.set({field:id});
    document.getElementById('row-'+id).scrollIntoView({block:'start'});
  });
  $('#kb').innerHTML=OB.kindBar(OB.state.kind);OB.bindKinds($('#kb'));

  function row(f,k){
    var th=OB.threads(f.id,k).slice(0,4),pr=OB.projects(f.id),co=OB.courses(f.id);
    return '<section class="band" id="row-'+f.id+'" data-row="'+f.id+'" style="--hh:'+f.h+'"><div class="wrap"><div class="head"><div><h2>'+f.name+'</h2><p>'+f.desc+'</p></div><a href="#">كل مواضيع '+f.name+' ('+f.topics+')</a></div>'+
     '<div class="rail"><div class="list"><h3>آخر المشاركات</h3><ul>'+(th.map(function(t){return '<li><a href="#"><b>'+t.title+'</b><span class="m">'+OB.kindTags(t)+' '+t.by+'، '+t.ago+'</span></a></li>';}).join('')||'<li class="empty">لا توجد مشاركات من هذا النوع.</li>')+'</ul></div>'+
     pr.map(function(p){return '<a class="pc" href="#">'+OB.cover(p)+'<div class="b"><b>'+p.title+'</b><div class="tg">'+p.tags.map(function(x){return '<i>'+x+'</i>';}).join('')+'</div><div class="f"><span>'+OB.av(p.by,'24px')+p.by+'</span><span>'+OB.icon('heart')+' '+p.likes+'</span></div></div></a>';}).join('')+
     co.map(function(c){return '<a class="cc" href="#" style="--h:'+c.h+'"><span class="lv">دورة، '+c.level+'</span><b>'+c.title+'</b><div class="m"><span>'+c.n+' درسًا</span><span>'+c.by+'</span></div></a>';}).join('')+
     '</div></div></section>';
  }
  OB.on(function(s){
    // re-render rows only when the kind filter changes (field changes just scroll)
    if(row.k!==s.kind){row.k=s.kind;$('#rows').innerHTML=D.fields.map(function(f){return row(f,s.kind);}).join('');$('#kb').innerHTML=OB.kindBar(s.kind);observe();}
  });
  var io;
  function observe(){
    if(io)io.disconnect();
    io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&Date.now()-lock>900&&OB.state.field!==e.target.dataset.row)OB.set({field:e.target.dataset.row});});},{rootMargin:'-45% 0px -50% 0px'});
    OB.$$('[data-row]').forEach(function(r){io.observe(r);});
  }
  var v=D.video;
  $('#under').innerHTML='<div><h2>أحدث فيديو على القناة</h2><a class="vid" href="#">'+OB.cover(v)+'<span class="play">'+OB.icon('play')+'</span></a><p style="margin-top:8px;font-weight:600">'+v.title+'</p></div>'+
   '<div><h2>أسئلة بلا إجابة</h2><ul>'+OB.unanswered(4).map(function(t){return '<li><a href="#">'+t.title+'<small>'+t.by+'، '+t.ago+'</small></a></li>';}).join('')+'</ul></div>'+
   '<div><h2>متصلون الآن ('+D.stats.online+')</h2><div class="faces">'+D.online.map(function(n){return OB.av(n,'34px');}).join('')+'</div></div>';
});
</script>
</body>
</html>
